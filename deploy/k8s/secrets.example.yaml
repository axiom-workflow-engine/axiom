apiVersion: v1
kind: Secret
metadata:
  name: axiom-secrets
  namespace: axiom
  labels:
    app.kubernetes.io/name: axiom-engine
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # REPLACE each value below with a freshly generated 64-byte random
  # secret before applying. Examples of generation:
  #   openssl rand -base64 64
  #   head -c 64 /dev/urandom | base64
  # Production deployments should prefer the ExternalSecret flow
  # (see deploy/examples/externalsecret/) so these values come
  # from a managed secret store instead of being committed anywhere.
  erlang-cookie: "REPLACE_WITH_64_BYTES_OF_RANDOM_BASE64"
  secret-key-base: "REPLACE_WITH_64_BYTES_OF_RANDOM_BASE64"
  jwt-secret: "REPLACE_WITH_64_BYTES_OF_RANDOM_BASE64"
