# Example: ExternalSecret + SecretStore
#
# This is the cloud-agnostic, production-recommended path for
# syncing the engine's secrets from a managed secret store. The
# engine chart's `externalSecret.enabled` flag will create an
# ExternalSecret that references a SecretStore you provide.
#
# Pick the SecretStore flavor that matches your provider:
#   - AWS Secrets Manager       — see examples/aws/secretsmanager-secretstore.yaml
#   - GCP Secret Manager        — see examples/gcp/secretsmanager-secretstore.yaml
#   - Azure Key Vault           — see examples/azure/keyvault-secretstore.yaml
#   - HashiCorp Vault           — see examples/vault/secretstore.yaml
# (Only AWS is bundled here as the reference; the others follow
# the same shape — see https://external-secrets.io/latest/provider/.)
#
# Workflow:
#   1. Apply the SecretStore in the engine's namespace
#   2. Populate the keys in the backing store (the ExternalSecret below
#      references them by remoteRef.key)
#   3. Install the chart with:
#        helm install axiom deploy/helm/axiom-engine \
#          --set externalSecret.enabled=true \
#          --set externalSecret.secretStoreName=axiom-secrets
#      The chart will create an ExternalSecret that materializes a
#      k8s Secret named "<release>-secrets". The StatefulSet reads
#      the same Secret keys as the auto-generated fallback.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: axiom-secrets
  namespace: axiom
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: axiom-engine
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: axiom-engine-secrets
  namespace: axiom
spec:
  secretStoreRef:
    name: axiom-secrets
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: axiom-engine-secrets
    creationPolicy: Owner
  data:
    - secretKey: erlang-cookie
      remoteRef:
        key: axiom/engine/prod
        property: erlang-cookie
    - secretKey: secret-key-base
      remoteRef:
        key: axiom/engine/prod
        property: secret-key-base
    - secretKey: jwt-secret
      remoteRef:
        key: axiom/engine/prod
        property: jwt-secret
