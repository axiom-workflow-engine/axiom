{{- /* Auto-generated Secret is the DEV/TEST fallback.
     For production, set either:
       secrets.existingSecret: "<name>"           # use a pre-created Secret
       externalSecret.enabled: true               # sync from an external store
*/}}
{{- if and (not .Values.secrets.existingSecret) (not .Values.externalSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axiom-engine.fullname" . }}-secrets
  labels:
    {{- include "axiom-engine.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.erlangCookie }}
  erlang-cookie: {{ .Values.secrets.erlangCookie | b64enc | quote }}
  {{- else }}
  erlang-cookie: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.secretKeyBase }}
  secret-key-base: {{ .Values.secrets.secretKeyBase | b64enc | quote }}
  {{- else }}
  secret-key-base: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
