{{- /*
ExternalSecret template — uses External Secrets Operator (ESO) to
synchronize the engine's secrets from an external secret store
(AWS Secrets Manager, GCP Secret Manager, Azure Key Vault, HashiCorp
Vault, etc.). This is the cloud-agnostic recommended path for
production deployments. The auto-generated Secret created by
secrets.yaml is intended only for dev/test; point secrets.existingSecret
at the ExternalSecret's name to wire it in.
*/}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "axiom-engine.fullname" . }}-secrets
  labels:
    {{- include "axiom-engine.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind | default "SecretStore" }}
  {{- if .Values.externalSecret.refreshInterval }}
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  {{- end }}
  target:
    name: {{ .Values.externalSecret.targetName | default (printf "%s-secrets" (include "axiom-engine.fullname" .)) }}
    creationPolicy: {{ .Values.externalSecret.creationPolicy | default "Owner" }}
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property }}
        {{- end }}
    {{- end }}
{{- end }}
